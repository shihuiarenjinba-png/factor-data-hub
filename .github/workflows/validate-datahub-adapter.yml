name: Validate factor-data-hub adapters

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile adapter and tests
        run: python -m py_compile datahub_official_macro.py tests/test_datahub_official_macro.py
      - name: Test manifest and checksum validation
        run: python -m unittest discover -s tests -p "test_datahub_official_macro.py" -v
